[project]
name = "mcp-aixbt-server"
version = "0.5.0-alpha"
description = "MCP Server for AIXBT Market Intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["mcp", "aixbt", "crypto", "market-intelligence", "fastapi"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
x402 = [
    "web3>=7.0.0",
    "eth-account>=0.13.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[project.scripts]
mcp-aixbt = "mcp_aixbt.main:run"
mcp-aixbt-stdio = "mcp_aixbt.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_aixbt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/mcp_aixbt --cov-report=term-missing"
